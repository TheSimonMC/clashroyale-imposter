<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imposter UI-Labor</title>
<style>html{color-scheme:dark}body{margin:0;background:#181818;color:#eee;font:13px system-ui}header{padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #444}h1{font-size:14px;margin:0}select,button{font:inherit;padding:8px;background:#292929;color:#eee;border:1px solid #555;border-radius:5px}label{display:flex;gap:8px;align-items:center}p{margin:0;color:#aaa;font-size:11px}main{padding:20px;overflow:auto}iframe{display:block;margin:auto;height:1000px;border:1px solid #555;background:#0b0c12}a{color:#c4b0ee}</style>
<header><h1>UI-Labor, nur für Entwicklung</h1><label>Breite<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label><label>Daten<select id="fixture"><option value="demo">Normale Daten</option><option value="worst">12 Personen, lange Namen</option><option value="three">3 Personen</option><option value="duplicates">Doppelte Namen</option><option value="custom">Eigene Begriffe, leer</option></select></label><button id="load">Neu laden</button><p>Testdaten ersetzen die Einstellungen auf diesem Vorschau-Ursprung. Beim Verlassen werden sie wiederhergestellt.</p></header>
<main><iframe id="preview" title="Responsive Spielvorschau" width="390"></iframe></main>
<script>
const key='imposter-after-dark-setup-v1';let old=null;try{old=localStorage.getItem(key)}catch{}
const fixtures={demo:{count:6,names:['Alex','Kim','Jo','Robin','Mika','Sam']},three:{count:3,names:['Alex','Kim','Sam']},worst:{count:12,names:['Aleksandra Wiśniewska','李小龍','Jo','Mohammed Al-Khatib','Éléonore de Villiers','Núria García-López','Maximilian Mustermann','👩🏽‍🚀 Kim','J','Jürgen Groß','O’Connor','Анна Петрова'],imposters:5},duplicates:{count:3,names:['Alex','alex','Kim']},custom:{count:3,names:['Jo','Kim','Sam'],theme:'custom',custom:''}};
function load(){const fixture=fixtures[document.querySelector('#fixture').value];try{localStorage.setItem(key,JSON.stringify({theme:'clash',mode:'classic',imposters:1,timer:180,hints:true,filters:{evo:true,champions:true,heroes:true},...fixture}))}catch{}document.querySelector('#preview').width=document.querySelector('#width').value;document.querySelector('#preview').src='../index.html?ui-lab=1'}
document.querySelector('#width').addEventListener('change',()=>document.querySelector('#preview').width=document.querySelector('#width').value);document.querySelector('#fixture').addEventListener('change',load);document.querySelector('#load').addEventListener('click',load);addEventListener('beforeunload',()=>{try{old===null?localStorage.removeItem(key):localStorage.setItem(key,old)}catch{}});load();
</script></html>
