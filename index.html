<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Royale Imposter</title>
<link rel="icon" type="image/png" href="https://cdns3.royaleapi.com/cdn-cgi/image/w=512,h=512,format=png,q=80/static/img/ui/league10.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #0f0f13;
    --panel-bg: rgba(30, 30, 45, 0.8);
    --primary: #4fc3f7;
    --text-main: #ffffff;
    --text-muted: #a0a0b0;
    --hint-color: #f1c40f;
    --danger: #ff4757;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top center, #1f2235, #000000);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}

h1 {
    font-weight: 800;
    margin-bottom: 5px;
    background: linear-gradient(to right, #fff, #4fc3f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    font-size: 26px;
    text-align: center;
}

.panel {
    background: var(--panel-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 25px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.6);
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 15px;
}

.toggle-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
}

.toggle-item {
    background: rgba(0,0,0,0.3);
    padding: 10px 5px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.05);
}

.toggle-item label {
    font-size: 9px;
    text-transform: uppercase;
    margin-top: 5px;
    color: var(--text-muted);
    text-align: center;
}

label.section-label {
    display: block;
    margin-top: 15px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--primary);
    font-weight: 600;
}

select, input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.4);
    color: white;
    font-family: inherit;
    outline: none;
}

.name-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.name-row span { width: 20px; font-size: 12px; color: var(--text-muted); }

button {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #4fc3f7, #0288d1);
    color: white;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 5px 20px rgba(79, 195, 247, 0.4);
}

#game, #voteScreen { width: 100%; max-width: 450px; text-align: center; }

#currentPlayer {
    font-size: 36px;
    margin: 15px 0;
    font-weight: 800;
    text-transform: uppercase;
}

.card-container { width: 220px; height: 310px; margin: 20px auto; perspective: 1000px; }
.card {
    width: 100%; height: 100%; position: relative; border-radius: 20px;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
    cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }

.face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 20px; overflow: hidden;
    border: 5px solid rgba(255,255,255,0.1);
}

.front {
    background-color: #333;
    display: flex; align-items: center; justify-content: center;
}
.front img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: luminosity; opacity: 0.7; }

.back { transform: rotateY(180deg); background: #000; display: flex; align-items: center; justify-content: center; }
.back img { width: 100%; height: 100%; object-fit: cover; }

.word-badge {
    position: absolute; bottom: 15px; background: rgba(0,0,0,0.9);
    color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
}

.imposter-card {
    background: radial-gradient(circle, #ff0044, #330000);
    width: 100%; height: 100%; display: flex; align-items: center;
    justify-content: center; flex-direction: column;
    padding: 20px;
    text-align: center;
}

.imposter-hint-box {
    margin-top: 20px;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    border: 1px dashed var(--hint-color);
    border-radius: 10px;
    color: var(--hint-color);
    font-size: 13px;
    line-height: 1.3;
}

/* Voting Styles */
.vote-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.vote-btn {
    padding: 15px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 0;
    box-shadow: none;
}

.vote-btn:active { transform: scale(0.95); }

.status-bar {
    background: rgba(0,0,0,0.4);
    padding: 10px;
    border-radius: 10px;
    font-size: 12px;
    margin-bottom: 10px;
    color: var(--text-muted);
}

.hidden { display: none !important; }
</style>
</head>

<body>

<h1>Clash Royale <span style="color:var(--primary)">Imposter</span></h1>

<div class="panel" id="setupPanel">
    <div class="settings-grid">
        <div>
            <label class="section-label">Spieler</label>
            <select id="playerCount" onchange="updateNames(); updateImposters();"></select>
        </div>
        <div>
            <label class="section-label">Imposter</label>
            <select id="imposters"></select>
        </div>
    </div>

    <label class="section-label">Einstellungen</label>
    <div class="toggle-container">
        <div class="toggle-item">
            <input type="checkbox" id="useEvo" checked>
            <label for="useEvo">Evos</label>
        </div>
        <div class="toggle-item">
            <input type="checkbox" id="useChampions" checked>
            <label for="useChampions">Champs</label>
        </div>
        <div class="toggle-item">
            <input type="checkbox" id="useHeroes" checked>
            <label for="useHeroes">Heroes</label>
        </div>
        <div class="toggle-item">
            <input type="checkbox" id="anonEject">
            <label for="anonEject">Anon Eject</label>
        </div>
    </div>

    <label class="section-label">Spielernamen</label>
    <div id="names"></div>

    <button onclick="start()">Spiel Starten</button>
</div>

<div id="game" class="hidden">
    <h2 id="currentPlayer"></h2>
    <div class="card-container">
        <div id="card" class="card">
            <div class="face front" id="cardFront">
                <img src="https://static.wikia.nocookie.net/clashroyale/images/3/3a/MysteryCard.png"> 
            </div>
            <div class="face back" id="backFace"></div>
        </div>
    </div>
    <p style="opacity:0.5; font-size:12px;">Gedrückt halten zum Ansehen</p>
    <button onclick="next()" id="nextBtn">Nächster Spieler</button>
</div>

<div id="voteScreen" class="panel hidden">
    <h2 style="margin-top:0;">Voting Phase</h2>
    <div id="imposterCountDisplay" class="status-bar"></div>
    <p style="font-size:13px; color:var(--text-muted);">Diskutiert und wählt jemanden aus:</p>
    <div id="voteGrid" class="vote-grid"></div>
</div>

let players = []; 
let index = 0;
let selectedCard;
let remainingImposters = 0;

function initSetup(){
    const ps = document.getElementById("playerCount");
    for(let i=3; i<=12; i++) ps.innerHTML += `<option ${i==6?'selected':''}>${i}</option>`;
    updateNames();
    updateImposters();
}

function updateNames(){
    const c = +document.getElementById("playerCount").value;
    const container = document.getElementById("names");
    container.innerHTML="";
    for(let i=1; i<=c; i++) container.innerHTML += `<div class="name-row"><span>${i}</span><input placeholder="Spieler ${i}"></div>`;
}

function updateImposters(){
    const c = +document.getElementById("playerCount").value;
    const sel = document.getElementById("imposters");
    sel.innerHTML = "";
    for(let i=1; i<=Math.floor(c/2); i++) sel.innerHTML += `<option>${i}</option>`;
}

function start(){
    let pool = [...baseCards];
    if(document.getElementById("useEvo").checked) pool = pool.concat(evoCards);
    if(document.getElementById("useChampions").checked) pool = pool.concat(championCards);
    if(document.getElementById("useHeroes").checked) pool = pool.concat(heroCards);

    const inputs = [...document.querySelectorAll("#names input")];
    const shuffledColors = shuffle([...playerColors]);
    
    selectedCard = pool[Math.floor(Math.random() * pool.length)];
    const numImposters = +document.getElementById("imposters").value;
    remainingImposters = numImposters;

    // Assign roles
    let roles = new Array(inputs.length).fill(false);
    for(let i=0; i<numImposters; i++) roles[i] = true;
    roles = shuffle(roles);

    players = inputs.map((input, idx) => ({
        name: input.value.trim() || input.placeholder,
        color: shuffledColors[idx % shuffledColors.length],
        isImposter: roles[idx],
        alive: true
    }));

    index = 0;
    document.getElementById("setupPanel").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    updateTurn();
}

function updateTurn(){
    const p = players[index];
    const nameEl = document.getElementById("currentPlayer");
    const cardEl = document.getElementById("card");
    const frontFace = document.getElementById("cardFront");

    cardEl.classList.remove("flipped");
    nameEl.innerText = p.name;
    nameEl.style.color = p.color;
    frontFace.style.backgroundColor = p.color;
    cardEl.style.boxShadow = `0 15px 45px ${p.color}60`;
}

function next(){
    if(index >= players.length - 1){
        startVoting();
        return;
    }
    index++;
    updateTurn();
}

function startVoting() {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("voteScreen").classList.remove("hidden");
    renderVoteGrid();
}

function renderVoteGrid() {
    const grid = document.getElementById("voteGrid");
    const countDisplay = document.getElementById("imposterCountDisplay");
    grid.innerHTML = "";
    
    countDisplay.innerText = `${remainingImposters} Imposter übrig`;

    players.forEach((p, idx) => {
        if(!p.alive) return;
        const btn = document.createElement("button");
        btn.className = "vote-btn";
        btn.style.borderColor = p.color;
        btn.innerText = p.name;
        btn.onclick = () => eject(idx);
        grid.appendChild(btn);
    });
}

function eject(idx) {
    const p = players[idx];
    const anon = document.getElementById("anonEject").checked;
    p.alive = false;

    let message = "";
    if (p.isImposter) {
        remainingImposters--;
        message = anon ? `${p.name} wurde eliminiert.` : `${p.name} war ein Imposter!`;
    } else {
        message = anon ? `${p.name} wurde eliminiert.` : `${p.name} war kein Imposter.`;
    }

    alert(message);
    checkGameOver();
}

function checkGameOver() {
    const alivePlayers = players.filter(p => p.alive);
    const aliveImposters = alivePlayers.filter(p => p.isImposter).length;
    const aliveCivilians = alivePlayers.length - aliveImposters;

    if (aliveImposters === 0) {
        alert("Sieg für die Zivilisten! Alle Imposter wurden gefunden.");
        location.reload();
    } else if (aliveImposters >= aliveCivilians) {
        alert("Sieg für die Imposter! Sie haben die Mehrheit übernommen.");
        location.reload();
    } else {
        renderVoteGrid();
    }
}

const cardElement = document.getElementById("card");
const backFace = document.getElementById("backFace");

const flipOn = (e) => {
    e.preventDefault();
    cardElement.classList.add("flipped");
    
    if(players[index].isImposter){
        const hint = selectedCard.h[Math.floor(Math.random() * selectedCard.h.length)];
        backFace.innerHTML = `<div class="imposter-card">
            <span style="font-size:60px">☠️</span>
            <span style="font-weight:800; letter-spacing:3px;">IMPOSTER</span>
            <div class="imposter-hint-box">
                <small style="text-transform:uppercase; display:block; margin-bottom:4px; opacity:0.7;">Tipp zur Karte:</small>
                <strong>${hint}</strong>
            </div>
        </div>`;
    } else {
        backFace.innerHTML = `
            <img src="${selectedCard.i}">
            <div class="word-badge">${selectedCard.n}</div>`;
    }
};

const flipOff = () => cardElement.classList.remove("flipped");

cardElement.addEventListener("mousedown", flipOn);
cardElement.addEventListener("mouseup", flipOff);
cardElement.addEventListener("touchstart", flipOn);
cardElement.addEventListener("touchend", flipOff);

function shuffle(a){
    for(let i=a.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

initSetup();
